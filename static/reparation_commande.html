<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
<title>Réparation & Commande — TRABELSI</title>
<style>
:root{--gold:#b8923c;--gold-l:#c9a84c;--gold-d:#7a5c20;--esp1:#1c1409;--esp2:#0e0902;
  --bg:#f6f1e8;--bg2:#ffffff;--bg3:#f3ecdf;--bd:#e8ddc7;--txt:#221c12;--muted:#9a8e79;--green:#2e7d52;--red:#b5341e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
.page{padding:20px 16px 90px;max-width:1240px;margin:0 auto;}

/* ── LAYOUT : contenu + historique vertical à droite (PC) ── */
.rc-layout{display:flex;gap:18px;align-items:flex-start;}
.rc-main{flex:1;min-width:0;}
.rc-history{width:330px;flex-shrink:0;position:sticky;top:16px;background:#fff;border:1px solid var(--bd);
  border-radius:18px;box-shadow:0 8px 22px rgba(60,40,10,.07);padding:14px 14px 10px;
  max-height:calc(100vh - 32px);overflow-y:auto;}
.rc-history .rc-section-title{margin:2px 2px 12px;}
@media(max-width:900px){ .rc-layout{display:block;} .rc-history{display:none;} }

.rc-hist-item{display:flex;align-items:center;gap:11px;padding:9px 9px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:all .13s;margin-bottom:5px;-webkit-tap-highlight-color:transparent;}
.rc-hist-item:hover{background:var(--bg3);border-color:var(--bd);}
.rc-hist-thumbs{display:flex;flex-shrink:0;}
.rc-hist-thumbs .th{width:36px;height:36px;border-radius:9px;overflow:hidden;border:2px solid #fff;margin-left:-11px;
  background:linear-gradient(135deg,#fbf3df,#eeddb2);display:flex;align-items:center;justify-content:center;font-size:15px;}
.rc-hist-thumbs .th:first-child{margin-left:0;}
.rc-hist-thumbs img{width:100%;height:100%;object-fit:cover;}
.rc-hist-info{flex:1;min-width:0;}
.rc-hist-client{font-size:13.5px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc-hist-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.rc-hist-amount{font-size:13px;font-weight:800;color:var(--gold-d);white-space:nowrap;}
.rc-hist-empty{color:var(--muted);font-size:13px;text-align:center;padding:26px 12px;line-height:1.5;}

/* ── DÉTAIL D'UN GROUPE (au clic depuis l'historique) ── */
.rc-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 13px;border-bottom:1px solid var(--bd);}
.rc-detail-client{font-family:'Cinzel',serif;font-size:19px;color:var(--gold-d);}
.rc-detail-date{font-size:12px;color:var(--muted);margin-top:3px;}
.rc-detail-money{display:flex;gap:8px;padding:14px 18px 8px;flex-wrap:wrap;}
.rc-detail-money .dm{flex:1;min-width:92px;background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;}
.rc-detail-money .dm span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin-bottom:3px;}
.rc-detail-money .dm b{font-size:16px;color:var(--txt);}
.rc-detail-money .dm.marge{background:rgba(46,125,82,.09);border-color:rgba(46,125,82,.2);}
.rc-detail-money .dm.marge b{color:var(--green);}
.rc-detail-money .dm.marge.neg{background:rgba(181,52,30,.08);border-color:rgba(181,52,30,.2);}
.rc-detail-money .dm.marge.neg b{color:var(--red);}
.rc-detail-pieces{padding:8px 15px 18px;display:flex;flex-direction:column;gap:9px;}


/* HERO */
.rc-hero{position:relative;overflow:hidden;text-align:center;padding:26px 20px 22px;
  background:linear-gradient(135deg,var(--esp1),var(--esp2));border-radius:20px;margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);}
.rc-hero h1{font-family:'Cinzel',serif;font-size:24px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(90deg,#f7ead0,#d8b968 55%,#f7ead0);-webkit-background-clip:text;background-clip:text;color:transparent;}
.rc-hero p{font-size:12px;color:rgba(232,201,104,.75);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;}

/* BOUTON AJOUTER */
.rc-add{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  padding:18px;border:none;border-radius:16px;cursor:pointer;margin-bottom:16px;
  background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:#1a1200;
  font-size:16px;font-weight:800;letter-spacing:.3px;box-shadow:0 8px 22px rgba(201,168,76,.35);
  transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;}
.rc-add:active{transform:scale(.98);}
.rc-add .rc-add-ic{font-size:22px;}
/* Bouton Historique — mobile uniquement (sur PC c'est le panneau de droite) */
.rc-hist-btn{display:none;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:15px;border:1px solid rgba(201,168,76,.4);border-radius:16px;cursor:pointer;margin-bottom:16px;
  background:#fff;color:var(--gold-d);font-size:15px;font-weight:800;letter-spacing:.3px;
  box-shadow:0 6px 16px rgba(60,40,10,.06);-webkit-tap-highlight-color:transparent;}
.rc-hist-btn:active{transform:scale(.98);}
.rc-hist-btn .n{background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:#fff;font-size:12px;
  font-weight:800;padding:1px 9px;border-radius:20px;}
@media(max-width:900px){.rc-hist-btn{display:flex;}}

/* FILTRES */
.rc-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.rc-chip{padding:8px 15px;border-radius:22px;border:1px solid var(--bd);background:var(--bg2);
  color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.rc-chip.on{background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:#1a1200;border-color:rgba(165,129,47,.5);}

/* GRILLE DE CARTES */
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.rc-card{position:relative;display:flex;align-items:flex-start;gap:11px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:16px;padding:11px 12px;box-shadow:0 8px 22px rgba(60,40,10,.07);}
.rc-thumb{width:58px;height:58px;flex-shrink:0;border-radius:13px;overflow:hidden;position:relative;cursor:pointer;
  background:linear-gradient(135deg,#fbf3df,#eeddb2);display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(201,168,76,.28);transition:transform .12s;}
.rc-thumb:active{transform:scale(.94);}
.rc-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.rc-thumb .ph{font-size:23px;opacity:.5;}
.rc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
.rc-badges{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.rc-badge{font-size:11px;font-weight:800;padding:3px 11px;border-radius:20px;letter-spacing:.2px;}
.rc-badge.reparation{background:rgba(52,152,219,.13);color:#1c5e86;border:1px solid rgba(52,152,219,.3);}
.rc-badge.commande{background:rgba(155,89,182,.13);color:#7d3ca1;border:1px solid rgba(155,89,182,.3);}
.rc-prep{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;
  background:rgba(201,168,76,.14);color:var(--gold-d);border:1px solid rgba(201,168,76,.3);}
.rc-date{font-size:11px;color:var(--muted);margin-left:auto;}
.rc-note{width:100%;min-height:70px;resize:vertical;border:1px solid var(--bd);border-radius:11px;
  padding:10px 12px;font-family:inherit;font-size:13.5px;color:var(--txt);background:var(--bg3);outline:none;
  transition:border-color .15s,background .15s;line-height:1.45;}
.rc-note:focus{border-color:rgba(201,168,76,.6);background:#fff;}
.rc-note::placeholder{color:var(--muted);}
.rc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rc-saved{font-size:11px;font-weight:700;color:var(--green);opacity:0;transition:opacity .2s;}
.rc-saved.show{opacity:1;}
.rc-del{background:transparent;border:1px solid rgba(181,52,30,.3);color:var(--red);
  border-radius:10px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;}
.rc-del:active{background:rgba(181,52,30,.08);}

.rc-empty{text-align:center;padding:50px 20px;color:var(--muted);}
.rc-empty .big{font-size:42px;opacity:.5;margin-bottom:12px;}

/* MODAL */
.rc-ov{display:none;position:fixed;inset:0;background:rgba(20,14,4,.55);backdrop-filter:blur(3px);
  z-index:1000;align-items:center;justify-content:center;padding:18px;}
.rc-ov.open{display:flex;}
.rc-modal{background:var(--bg2);border-radius:20px;width:100%;max-width:420px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.4);max-height:92vh;overflow-y:auto;}
.rc-modal-photo{width:100%;aspect-ratio:4/3;background:#00000010;object-fit:cover;display:block;}
.rc-modal-body{padding:18px 18px 20px;}
.rc-modal h2{font-family:'Cinzel',serif;font-size:19px;color:var(--gold-d);margin-bottom:16px;text-align:center;}
.rc-field{margin-bottom:16px;}
.rc-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;display:block;}
.rc-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.rc-opt{padding:13px 10px;border:1.5px solid var(--bd);border-radius:13px;background:var(--bg3);
  cursor:pointer;text-align:center;font-size:14px;font-weight:700;color:var(--txt);transition:all .15s;
  -webkit-tap-highlight-color:transparent;}
.rc-opt.on{border-color:var(--gold);background:rgba(201,168,76,.12);color:var(--gold-d);box-shadow:0 4px 12px rgba(201,168,76,.2);}
.rc-modal .rc-note{min-height:80px;}
.rc-modal-actions{display:flex;gap:10px;margin-top:6px;}
.rc-btn{flex:1;padding:13px;border-radius:13px;border:none;cursor:pointer;font-size:14px;font-weight:800;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.rc-btn-save{background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:#1a1200;box-shadow:0 6px 16px rgba(201,168,76,.32);}
.rc-btn-save:disabled{opacity:.55;}
.rc-btn-cancel{background:var(--bg3);color:var(--muted);flex:0 0 auto;padding:13px 18px;}

@media(max-width:860px){ .rc-grid{grid-template-columns:1fr;} }

/* ── SÉLECTION (cases à cocher) ── */
.rc-check{flex-shrink:0;width:26px;height:26px;margin-top:16px;border-radius:8px;
  border:2px solid rgba(201,168,76,.55);background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;font-weight:800;
  color:transparent;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.rc-card.sel .rc-check{background:linear-gradient(135deg,var(--gold-l),var(--gold-d));border-color:var(--gold-d);color:#1a1200;}
.rc-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.45),0 8px 22px rgba(60,40,10,.1);}

/* ── BARRE D'ACTION DE SÉLECTION ── */
#rc-actionbar{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(160px);z-index:900;
  display:flex;gap:9px;align-items:center;background:linear-gradient(135deg,var(--esp1),var(--esp2));
  color:#f0e0b8;padding:9px 10px 9px 16px;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.4);
  transition:transform .26s cubic-bezier(.32,.72,0,1),opacity .2s;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;}
#rc-actionbar.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto;}
#rc-actionbar .cnt{font-weight:700;font-size:13px;white-space:nowrap;}
.rc-ab-btn{background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:#1a1200;border:none;
  border-radius:11px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.rc-ab-sel{background:rgba(255,255,255,.08);color:#f0e0b8;border:1px solid rgba(201,168,76,.4);
  border-radius:11px;padding:8px 9px;font-size:12px;font-family:inherit;outline:none;max-width:150px;}
.rc-ab-x{background:transparent;border:none;color:rgba(240,224,184,.7);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;}

/* ── GROUPES ── */
.rc-section-title{font-family:'Cinzel',serif;font-size:15px;color:var(--gold-d);margin:4px 2px 12px;
  display:flex;align-items:center;gap:8px;letter-spacing:.3px;}
.rc-group{background:#fff;border:1px solid rgba(201,168,76,.32);border-radius:18px;overflow:hidden;
  margin-bottom:14px;box-shadow:0 8px 22px rgba(60,40,10,.08);}
.rc-group-head{background:linear-gradient(135deg,#fbf3df,#f0e2bd);padding:14px 15px;border-bottom:1px solid var(--bd);}
.rc-group-topline{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.rc-group-topline .ic{font-size:17px;}
.rc-group-topline .t{font-family:'Cinzel',serif;font-size:14px;color:var(--gold-d);flex:1;letter-spacing:.3px;}
.rc-group-topline .n{font-size:11px;color:var(--muted);}
.rc-group-del{background:transparent;border:1px solid rgba(181,52,30,.3);color:var(--red);border-radius:9px;
  padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.rc-fld{margin-bottom:9px;}
.rc-fld label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:block;margin-bottom:4px;}
.rc-fld input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:14px;
  font-family:inherit;background:#fff;color:var(--txt);outline:none;transition:border-color .15s;}
.rc-fld input:focus{border-color:rgba(201,168,76,.6);}
.rc-money-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.rc-marge{margin-top:4px;display:flex;justify-content:space-between;align-items:center;padding:10px 13px;
  border-radius:11px;background:rgba(46,125,82,.09);border:1px solid rgba(46,125,82,.18);}
.rc-marge.neg{background:rgba(181,52,30,.08);border-color:rgba(181,52,30,.2);}
.rc-marge .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
.rc-marge .val{font-size:18px;font-weight:900;color:var(--green);}
.rc-marge.neg .val{color:var(--red);}
.rc-group-members{padding:12px 13px;display:flex;flex-direction:column;gap:9px;}
.rc-mini{display:flex;gap:11px;align-items:flex-start;background:var(--bg3);border:1px solid var(--bd);border-radius:13px;padding:9px 10px;}
.rc-mini-thumb{width:54px;height:54px;border-radius:11px;flex-shrink:0;overflow:hidden;position:relative;cursor:pointer;
  background:linear-gradient(135deg,#fbf3df,#eeddb2);display:flex;align-items:center;justify-content:center;}
.rc-mini-thumb img{width:100%;height:100%;object-fit:cover;}
.rc-mini-thumb .ph{font-size:21px;opacity:.5;}
.rc-mini-body{flex:1;min-width:0;}
.rc-mini .rc-badges{margin-bottom:5px;}
.rc-mini .rc-note{min-height:42px;font-size:12.5px;padding:7px 9px;}
.rc-ungroup{background:#fff;border:1px solid var(--bd);color:var(--muted);border-radius:9px;width:30px;height:30px;
  flex-shrink:0;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.rc-ungroup:active{background:var(--bg3);}

/* ── VISIONNEUSE PLEIN ÉCRAN (zoom photo) ── */
#rc-zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;
  align-items:center;justify-content:center;padding:16px;cursor:zoom-out;}
#rc-zoom.open{display:flex;}
#rc-zoom img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);object-fit:contain;}
#rc-zoom .rc-zoom-x{position:absolute;top:16px;right:18px;color:#fff;font-size:34px;font-weight:300;
  line-height:1;background:none;border:none;cursor:pointer;opacity:.85;}

/* Toast */
#rc-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--esp1);color:#f0e0b8;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:all .25s;z-index:1100;pointer-events:none;white-space:nowrap;}
#rc-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<nav style="display:none"></nav>

<div class="page">
  <div class="rc-hero">
    <h1>🛠️ Réparation &amp; Commande</h1>
    <p>Atelier · Hicham &amp; Driss</p>
  </div>

  <button class="rc-add" onclick="document.getElementById('rc-file').click()">
    <span class="rc-add-ic">📸</span> Nouvelle photo
  </button>
  <input type="file" id="rc-file" accept="image/*" style="display:none" onchange="onPhoto(event)">

  <button class="rc-hist-btn" onclick="openHist()">🗂️ Historique <span class="n" id="rc-hist-count">0</span></button>

  <div class="rc-filters">
    <button class="rc-chip on" data-f="type" data-v="" onclick="setFilter(this)">Tout</button>
    <button class="rc-chip" data-f="type" data-v="reparation" onclick="setFilter(this)">🔧 Réparations</button>
    <button class="rc-chip" data-f="type" data-v="commande" onclick="setFilter(this)">🛒 Commandes</button>
    <span style="flex:1"></span>
    <button class="rc-chip on" data-f="prep" data-v="" onclick="setFilter(this)">Tous</button>
    <button class="rc-chip" data-f="prep" data-v="Hicham" onclick="setFilter(this)">👤 Hicham</button>
    <button class="rc-chip" data-f="prep" data-v="Driss" onclick="setFilter(this)">👤 Driss</button>
  </div>

  <div class="rc-layout">
    <div class="rc-main">
      <div id="rc-groups"></div>
      <div id="rc-list-title" class="rc-section-title" style="display:none">📋 À traiter</div>
      <div id="rc-grid" class="rc-grid"></div>
      <div id="rc-empty" class="rc-empty" style="display:none">
        <div class="big">🛠️</div>
        <p>Aucune fiche pour le moment.<br>Prends une photo pour commencer.</p>
      </div>
    </div>
    <aside class="rc-history">
      <div class="rc-section-title" style="margin-top:0">🗂️ Historique</div>
      <div id="rc-histlist"></div>
    </aside>
  </div>
</div>

<!-- Barre d'action (sélection) -->
<div id="rc-actionbar">
  <span class="cnt"><span id="rc-ab-cnt">0</span> sélectionné(s)</span>
  <button class="rc-ab-btn" onclick="creerGroupe()">🔗 Créer un groupe</button>
  <select class="rc-ab-sel" id="rc-ab-add" onchange="ajouterAuGroupe(this)"></select>
  <button class="rc-ab-x" onclick="clearSel()" title="Annuler">✕</button>
</div>

<!-- MODAL création -->
<div class="rc-ov" id="rc-ov">
  <div class="rc-modal">
    <img id="rc-modal-photo" class="rc-modal-photo" alt="">
    <div class="rc-modal-body">
      <h2>Nouvelle fiche</h2>
      <div class="rc-field">
        <span class="rc-label">Type</span>
        <div class="rc-opts">
          <div class="rc-opt on" data-g="type" data-v="reparation" onclick="pick(this)">🔧 Réparation</div>
          <div class="rc-opt" data-g="type" data-v="commande" onclick="pick(this)">🛒 Commande</div>
        </div>
      </div>
      <div class="rc-field">
        <span class="rc-label">Qui prépare ?</span>
        <div class="rc-opts">
          <div class="rc-opt" data-g="prep" data-v="Hicham" onclick="pick(this)">👤 Hicham</div>
          <div class="rc-opt" data-g="prep" data-v="Driss" onclick="pick(this)">👤 Driss</div>
        </div>
      </div>
      <div class="rc-field">
        <span class="rc-label">Note (facultatif)</span>
        <textarea class="rc-note" id="rc-modal-note" placeholder="Ce qui sera fait…"></textarea>
      </div>
      <div class="rc-modal-actions">
        <button class="rc-btn rc-btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="rc-btn rc-btn-save" id="rc-save" onclick="save()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- Historique (fenêtre mobile) -->
<div class="rc-ov" id="rc-hist-ov">
  <div class="rc-modal">
    <div class="rc-detail-head">
      <div class="rc-detail-client" style="font-size:18px">🗂️ Historique</div>
      <button class="rc-btn rc-btn-cancel" style="flex:0 0 auto;padding:9px 15px" onclick="closeHist()">Fermer</button>
    </div>
    <div id="rc-histlist-m" style="padding:10px 13px 16px"></div>
  </div>
</div>

<!-- Détail d'un groupe (historique) -->
<div class="rc-ov" id="rc-detail-ov">
  <div class="rc-modal" id="rc-detail-modal"></div>
</div>

<!-- Visionneuse plein écran -->
<div id="rc-zoom" onclick="if(event.target.id==='rc-zoom'||event.target.className==='rc-zoom-x')this.classList.remove('open')">
  <button class="rc-zoom-x">✕</button>
  <img id="rc-zoom-img" alt="">
</div>

<div id="rc-toast"></div>

<script>
let ALL = [];
let GROUPS = [];
let selected = new Set();
let filterType = '', filterPrep = '';
let pending = { photo:null, type:'reparation', prep:'' };
const fmtN = v => Number(v||0).toLocaleString('fr-FR',{maximumFractionDigits:0});

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=document.getElementById('rc-toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function zoom(id){
  const r=ALL.find(x=>x.id===id);
  if(!r || !r.has_photo){ toast('Pas de photo'); return; }
  document.getElementById('rc-zoom-img').src='/api/reparation-commande/photo/'+id;
  document.getElementById('rc-zoom').classList.add('open');
}

async function load(){
  try{
    const [rep, grp] = await Promise.all([
      fetch('/api/reparation-commande').then(r=>r.json()),
      fetch('/api/reparation-groupe').then(r=>r.json())
    ]);
    ALL = rep; GROUPS = grp;
  }catch(e){ ALL = ALL||[]; GROUPS = GROUPS||[]; }
  // Nettoyer la sélection des fiches qui n'existent plus / sont groupées
  selected.forEach(id=>{ const r=ALL.find(x=>x.id===id); if(!r || r.groupe_id) selected.delete(id); });
  render();
}

function setFilter(btn){
  const f=btn.dataset.f, v=btn.dataset.v;
  document.querySelectorAll(`.rc-chip[data-f="${f}"]`).forEach(c=>c.classList.toggle('on', c===btn));
  if(f==='type') filterType=v; else filterPrep=v;
  render();
}

function badgeHtml(r){
  const label = r.type==='commande' ? '🛒 Commande' : '🔧 Réparation';
  return `<span class="rc-badge ${r.type}">${label}</span>`+
    (r.preparateur?`<span class="rc-prep">👤 ${esc(r.preparateur)}</span>`:'');
}
function photoHtml(r){
  return `<span class="ph">${r.type==='commande'?'🛒':'🔧'}</span>`+
    (r.has_photo?`<img loading="lazy" src="/api/reparation-commande/photo/${r.id}" alt="" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()">`:'');
}
function noteHtml(r){
  return `<textarea class="rc-note" placeholder="Décris ce qui sera fait…" onfocus="this._old=this.value" onblur="saveNote(${r.id},this)">${esc(r.note)}</textarea>`;
}

function render(){
  // ── Groupes (en haut) ──
  document.getElementById('rc-groups').innerHTML = GROUPS.map(renderGroup).join('');
  renderHistory();

  // ── Fiches non groupées ──
  const grid=document.getElementById('rc-grid');
  const empty=document.getElementById('rc-empty');
  const title=document.getElementById('rc-list-title');
  let rows = ALL.filter(r => !r.groupe_id &&
    (!filterType || r.type===filterType) &&
    (!filterPrep || r.preparateur===filterPrep));

  title.style.display = (rows.length && GROUPS.length) ? 'flex' : 'none';
  if(!rows.length){
    grid.innerHTML='';
    empty.style.display = (ALL.length===0) ? 'block' : 'none';
  } else {
    empty.style.display='none';
    grid.innerHTML = rows.map(r=>`
      <div class="rc-card ${selected.has(r.id)?'sel':''}">
        <div class="rc-check" onclick="toggleSel(${r.id})">✓</div>
        <div class="rc-thumb" onclick="zoom(${r.id})">${photoHtml(r)}</div>
        <div class="rc-body">
          <div class="rc-badges">${badgeHtml(r)}<span class="rc-date">${esc(r.created_at)}</span></div>
          ${noteHtml(r)}
          <div class="rc-foot">
            <span class="rc-saved" id="sv-${r.id}">✓ Enregistré</span>
            <button class="rc-del" onclick="delCard(${r.id})">🗑️ Supprimer</button>
          </div>
        </div>
      </div>`).join('');
  }
  updateActionbar();
}

function renderGroup(g){
  const membres = g.membres.map(id=>ALL.find(r=>r.id===id)).filter(Boolean);
  const marge = (Number(g.montant)||0) - (Number(g.paye_fournisseur)||0);
  return `
  <div class="rc-group">
    <div class="rc-group-head">
      <div class="rc-group-topline">
        <span class="ic">📦</span>
        <span class="t">Groupe</span>
        <span class="n">${membres.length} pièce(s)</span>
        <button class="rc-group-del" onclick="delGroupe(${g.id})">🗑️ Supprimer</button>
      </div>
      <div class="rc-fld">
        <label>Client</label>
        <input type="text" value="${esc(g.client)}" placeholder="Nom du client"
          onchange="saveGroup(${g.id},'client',this.value)">
      </div>
      <div class="rc-money-row">
        <div class="rc-fld">
          <label>Montant (client)</label>
          <input type="number" inputmode="decimal" value="${g.montant||''}" placeholder="0"
            data-g="${g.id}" data-k="montant" oninput="liveMarge(${g.id})"
            onchange="saveGroup(${g.id},'montant',this.value)">
        </div>
        <div class="rc-fld">
          <label>Payé fournisseur</label>
          <input type="number" inputmode="decimal" value="${g.paye_fournisseur||''}" placeholder="0"
            data-g="${g.id}" data-k="paye_fournisseur" oninput="liveMarge(${g.id})"
            onchange="saveGroup(${g.id},'paye_fournisseur',this.value)">
        </div>
      </div>
      <div class="rc-marge ${marge<0?'neg':''}" id="marge-${g.id}">
        <span class="lbl">Marge (bénéfice)</span>
        <span class="val">${fmtN(marge)} MAD</span>
      </div>
    </div>
    <div class="rc-group-members">
      ${membres.map(r=>`
        <div class="rc-mini">
          <div class="rc-mini-thumb" onclick="zoom(${r.id})">${photoHtml(r)}</div>
          <div class="rc-mini-body">
            <div class="rc-badges">${badgeHtml(r)}</div>
            ${noteHtml(r)}
          </div>
          <button class="rc-ungroup" title="Retirer du groupe" onclick="ungroup(${r.id})">✕</button>
        </div>`).join('') || '<div style="color:var(--muted);font-size:13px;text-align:center;padding:6px">Aucune pièce</div>'}
    </div>
  </div>`;
}

function liveMarge(gid){
  const m=document.querySelector(`input[data-g="${gid}"][data-k="montant"]`);
  const p=document.querySelector(`input[data-g="${gid}"][data-k="paye_fournisseur"]`);
  const marge=(parseFloat(m.value)||0)-(parseFloat(p.value)||0);
  const box=document.getElementById('marge-'+gid);
  box.classList.toggle('neg', marge<0);
  box.querySelector('.val').textContent=fmtN(marge)+' MAD';
}

/* ── Historique (colonne de droite) ── */
function renderHistory(){
  const html = GROUPS.length ? GROUPS.map(g=>{
    const membres=g.membres.map(id=>ALL.find(r=>r.id===id)).filter(Boolean);
    const thumbs=membres.slice(0,3).map(r=>
      `<span class="th">${r.has_photo?`<img src="/api/reparation-commande/photo/${r.id}" alt="" onerror="this.parentNode.textContent='📦'">`:(r.type==='commande'?'🛒':'🔧')}</span>`
    ).join('');
    return `<div class="rc-hist-item" onclick="openDetail(${g.id})">
      <div class="rc-hist-thumbs">${thumbs||'<span class="th">📦</span>'}</div>
      <div class="rc-hist-info">
        <div class="rc-hist-client">${g.client?esc(g.client):'Groupe #'+g.id}</div>
        <div class="rc-hist-sub">${membres.length} pièce(s) · ${esc(g.created_at)}</div>
      </div>
      <div class="rc-hist-amount">${g.montant?fmtN(g.montant)+' MAD':'—'}</div>
    </div>`;
  }).join('') : '<div class="rc-hist-empty">Aucune commande / réparation groupée.<br>Coche des fiches puis « Créer un groupe » pour les voir ici.</div>';
  const d=document.getElementById('rc-histlist');   if(d) d.innerHTML=html;
  const m=document.getElementById('rc-histlist-m'); if(m) m.innerHTML=html;
  const c=document.getElementById('rc-hist-count'); if(c) c.textContent=GROUPS.length;
}
function openHist(){ document.getElementById('rc-hist-ov').classList.add('open'); }
function closeHist(){ document.getElementById('rc-hist-ov').classList.remove('open'); }

function openDetail(gid){
  const g=GROUPS.find(x=>x.id===gid); if(!g) return;
  closeHist();
  const membres=g.membres.map(id=>ALL.find(r=>r.id===id)).filter(Boolean);
  const marge=(Number(g.montant)||0)-(Number(g.paye_fournisseur)||0);
  document.getElementById('rc-detail-modal').innerHTML=`
    <div class="rc-detail-head">
      <div>
        <div class="rc-detail-client">${g.client?esc(g.client):'Groupe #'+g.id}</div>
        <div class="rc-detail-date">${esc(g.created_at)} · ${membres.length} pièce(s)</div>
      </div>
      <button class="rc-btn rc-btn-cancel" style="flex:0 0 auto;padding:9px 15px" onclick="closeDetail()">Fermer</button>
    </div>
    <div class="rc-detail-money">
      <div class="dm"><span>Montant client</span><b>${fmtN(g.montant)} MAD</b></div>
      <div class="dm"><span>Payé fournisseur</span><b>${fmtN(g.paye_fournisseur)} MAD</b></div>
      <div class="dm marge ${marge<0?'neg':''}"><span>Marge</span><b>${fmtN(marge)} MAD</b></div>
    </div>
    <div class="rc-detail-pieces">
      ${membres.map(r=>`
        <div class="rc-mini" style="background:var(--bg3)">
          <div class="rc-mini-thumb" onclick="zoom(${r.id})">${photoHtml(r)}</div>
          <div class="rc-mini-body">
            <div class="rc-badges">${badgeHtml(r)}</div>
            <div style="font-size:12.5px;color:var(--txt);margin-top:6px;white-space:pre-wrap;line-height:1.4">${r.note?esc(r.note):'<span style="color:var(--muted)">(pas de note)</span>'}</div>
          </div>
        </div>`).join('') || '<div style="color:var(--muted);text-align:center;padding:12px">Aucune pièce dans ce groupe</div>'}
    </div>`;
  document.getElementById('rc-detail-ov').classList.add('open');
}
function closeDetail(){ document.getElementById('rc-detail-ov').classList.remove('open'); }

/* ── Sélection ── */
function toggleSel(id){ selected.has(id)?selected.delete(id):selected.add(id); render(); }
function clearSel(){ selected.clear(); render(); }
function updateActionbar(){
  document.getElementById('rc-ab-cnt').textContent=selected.size;
  const sel=document.getElementById('rc-ab-add');
  if(GROUPS.length){
    sel.style.display='';
    sel.innerHTML='<option value="">Ajouter à un groupe…</option>'+
      GROUPS.map(g=>`<option value="${g.id}">${g.client?esc(g.client):'Groupe #'+g.id}</option>`).join('');
  } else sel.style.display='none';
  document.getElementById('rc-actionbar').classList.toggle('show', selected.size>0);
}

/* ── Groupes : actions ── */
async function creerGroupe(){
  if(!selected.size) return;
  try{
    await fetch('/api/reparation-groupe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected]})});
    selected.clear(); toast('Groupe créé ✓'); await load();
  }catch(e){ toast('Erreur'); }
}
async function ajouterAuGroupe(sel){
  const gid=sel.value; sel.value='';
  if(!gid || !selected.size) return;
  try{
    await fetch('/api/reparation-groupe/'+gid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({add_ids:[...selected]})});
    selected.clear(); toast('Ajouté au groupe ✓'); await load();
  }catch(e){ toast('Erreur'); }
}
async function saveGroup(gid, field, value){
  try{
    await fetch('/api/reparation-groupe/'+gid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({[field]:value})});
    const g=GROUPS.find(x=>x.id===gid); if(g) g[field]=value;
    toast('Enregistré ✓');
  }catch(e){ toast('Non enregistré'); }
}
async function ungroup(id){
  const g=GROUPS.find(x=>x.membres.includes(id)); if(!g) return;
  try{
    await fetch('/api/reparation-groupe/'+g.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({remove_ids:[id]})});
    toast('Retiré du groupe'); await load();
  }catch(e){ toast('Erreur'); }
}
async function delGroupe(gid){
  if(!confirm('Supprimer ce groupe ? (les fiches ne seront pas supprimées)')) return;
  try{
    await fetch('/api/reparation-groupe/'+gid,{method:'DELETE'});
    toast('Groupe supprimé'); await load();
  }catch(e){ toast('Erreur'); }
}

/* ── Compression photo côté client ── */
function compress(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=1100; let w=img.width,h=img.height;
        if(w>h && w>max){h=Math.round(h*max/w);w=max;}
        else if(h>=w && h>max){w=Math.round(w*max/h);h=max;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}

async function onPhoto(ev){
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  toast('Compression de la photo…');
  try{
    const dataUrl=await compress(file);
    pending={ photo:dataUrl, type:'reparation', prep:'' };
    document.getElementById('rc-modal-photo').src=dataUrl;
    document.getElementById('rc-modal-note').value='';
    // reset des choix
    document.querySelectorAll('.rc-opt[data-g="type"]').forEach(o=>o.classList.toggle('on',o.dataset.v==='reparation'));
    document.querySelectorAll('.rc-opt[data-g="prep"]').forEach(o=>o.classList.remove('on'));
    document.getElementById('rc-ov').classList.add('open');
  }catch(e){ toast('Erreur photo'); }
}

function pick(el){
  const g=el.dataset.g;
  document.querySelectorAll(`.rc-opt[data-g="${g}"]`).forEach(o=>o.classList.toggle('on',o===el));
  if(g==='type') pending.type=el.dataset.v; else pending.prep=el.dataset.v;
}

function closeModal(){ document.getElementById('rc-ov').classList.remove('open'); pending.photo=null; }

async function save(){
  if(!pending.photo){ closeModal(); return; }
  const btn=document.getElementById('rc-save'); btn.disabled=true; btn.textContent='Enregistrement…';
  const body={
    type: pending.type,
    preparateur: pending.prep,
    note: document.getElementById('rc-modal-note').value.trim(),
    photo_base64: pending.photo.split(',')[1]
  };
  try{
    const res=await fetch('/api/reparation-commande',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok) throw new Error();
    closeModal(); toast('Fiche créée ✓'); await load();
  }catch(e){ toast('Erreur : non enregistré'); }
  finally{ btn.disabled=false; btn.textContent='Enregistrer'; }
}

async function saveNote(id, ta){
  if(ta._old===ta.value) return;
  try{
    await fetch('/api/reparation-commande/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:ta.value})});
    const sv=document.getElementById('sv-'+id); if(sv){sv.classList.add('show');setTimeout(()=>sv.classList.remove('show'),1600);}
    const r=ALL.find(x=>x.id===id); if(r) r.note=ta.value;
  }catch(e){ toast('Note non enregistrée'); }
}

async function delCard(id){
  if(!confirm('Supprimer cette fiche ?')) return;
  try{
    await fetch('/api/reparation-commande/'+id,{method:'DELETE'});
    selected.delete(id); toast('Fiche supprimée'); await load();
  }catch(e){ toast('Suppression impossible'); }
}

document.getElementById('rc-ov').addEventListener('click',e=>{ if(e.target.id==='rc-ov') closeModal(); });
document.getElementById('rc-detail-ov').addEventListener('click',e=>{ if(e.target.id==='rc-detail-ov') closeDetail(); });
document.getElementById('rc-hist-ov').addEventListener('click',e=>{ if(e.target.id==='rc-hist-ov') closeHist(); });
load();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/static/sw.js");}</script>
</body>
</html>
